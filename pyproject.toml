[project]
name = "disguise-lab"
version = "0.1.0"
description = "Offline snap-conditioned defensive movement research workbench"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy", "polars", "pyarrow", "duckdb", "scikit-learn",
  "pydantic>=2", "fastapi", "uvicorn", "typer", "matplotlib",
  "torch", "torch-geometric", "httpx",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]
access = ["kaggle"]

[project.scripts]
disguise-lab = "disguise_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disguise_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
